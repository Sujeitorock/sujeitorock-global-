<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<title>Sujeito Rock — Request a Song</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#000000;--bg2:#111111;--bg3:#1e1e1e;--red:#c0392b;--red2:#e74c3c;--white:#fff;--gray:#666;--gray2:#999;--border:rgba(255,255,255,0.08);--radius:12px}
html,body{background:var(--bg);color:var(--white);font-family:"Barlow",sans-serif;min-height:100vh;overflow-x:hidden}
#root{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--red);color:white;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.screen{min-height:100vh;display:flex;flex-direction:column}
.fade-in{animation:fadeIn 0.25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* HOME HEADER */
.home-header{position:relative;padding:28px 20px 20px;background:var(--bg);overflow:hidden}
.header-inner{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.header-photo{width:84px;height:84px;border-radius:50%;border:2px solid var(--red);object-fit:cover;object-position:center top;flex-shrink:0;box-shadow:0 0 0 4px rgba(192,57,43,0.15)}
.header-right{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.header-name{font-family:"Bebas Neue",cursive;font-size:26px;letter-spacing:2px;line-height:1}
.header-tagline{font-size:12px;color:var(--gray2);letter-spacing:0.5px}
.header-logos{display:flex;align-items:center;gap:14px;margin-top:4px;height:42px}
.sl-logo{height:32px;opacity:0.85;display:block;object-fit:contain}
.sponsor-wrap{display:flex;align-items:center;border-left:1px solid var(--border);padding-left:14px;height:100%}
.sponsor-label{display:none}
.vside-logo{height:42px;opacity:1;display:block;object-fit:contain}
.show-venue-logo{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.show-venue-fallback{width:64px;height:64px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:"Bebas Neue",cursive;font-size:24px;color:white;border:1px solid var(--border)}

/* SEARCH */
.select-toggle{background:var(--red);border:1px solid var(--red);color:var(--white);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:"Barlow",sans-serif;flex-shrink:0;transition:all 0.2s}
.select-toggle.active{background:var(--bg3);border-color:var(--gray);color:var(--gray2)}
.song-item.song-selected{border-color:var(--red);background:rgba(192,57,43,0.12)}
.song-check{width:24px;height:24px;border-radius:6px;border:2px solid var(--gray);flex-shrink:0;margin-right:8px;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.15s}
.song-selected .song-check{background:var(--red);border-color:var(--red);color:white}
.select-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:2px solid var(--red);padding:12px 20px;z-index:300;display:flex;align-items:center;gap:12px;animation:slideUp 0.2s ease}
@keyframes slideUp{from{transform:translateX(-50%) translateY(100%)}to{transform:translateX(-50%) translateY(0)}}
.select-bar-info{flex:1;font-size:13px;font-weight:700;color:var(--white)}
.select-bar-info span{color:var(--red2)}
.btn-request-all{background:var(--red);color:white;border:none;border-radius:8px;padding:12px 18px;font-family:"Bebas Neue",cursive;font-size:16px;letter-spacing:1px;cursor:pointer;white-space:nowrap}
.song-del-btn{background:none;border:none;color:var(--gray);font-size:15px;cursor:pointer;padding:4px 6px;flex-shrink:0;transition:color 0.2s;line-height:1}
.song-del-btn:hover{color:var(--red2)}
.song-move-btn{background:none;border:1px solid var(--border);color:var(--gray2);font-size:11px;cursor:pointer;padding:4px 8px;border-radius:6px;flex-shrink:0;font-family:"Barlow",sans-serif;font-weight:700;transition:all 0.2s;white-space:nowrap}
.song-move-btn.active{border-color:var(--red);color:var(--red2)}
.move-song-panel{background:var(--bg2);border:1px solid rgba(192,57,43,0.4);border-radius:10px;padding:10px 12px;margin:2px 0 6px;animation:fadeIn 0.15s ease}
.move-song-panel-title{font-size:11px;color:var(--gray2);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.move-pl-pills{display:flex;flex-wrap:wrap;gap:6px}
.move-pl-pill{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:5px 12px;color:var(--white);font-size:12px;font-weight:700;cursor:pointer;font-family:"Barlow",sans-serif;transition:all 0.2s}
.move-pl-pill:hover{border-color:var(--red);color:var(--red2);background:rgba(192,57,43,0.1)}
.delete-pl-btn{background:none;border:none;color:var(--gray);font-size:16px;cursor:pointer;padding:4px 8px;transition:color 0.2s;flex-shrink:0}
.delete-pl-btn:hover{color:var(--red2)}
.search-bar{margin:0 20px 16px;position:relative}
.search-bar input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:30px;padding:12px 20px 12px 44px;color:var(--white);font-family:"Barlow",sans-serif;font-size:15px;outline:none;transition:border-color 0.2s}
.search-bar input::placeholder{color:var(--gray)}
.search-bar input:focus{border-color:var(--red)}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:18px}
.search-results{padding:0 20px 20px}
.search-result-item{display:flex;align-items:center;padding:14px 16px;background:var(--bg3);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:background 0.2s;border:1px solid var(--border)}
.search-result-item:hover{background:#1a0808}
.search-result-info{flex:1}
.search-result-title{font-weight:600;font-size:15px}
.search-result-artist{color:var(--gray2);font-size:13px;margin-top:2px}
.search-result-pl{font-size:11px;color:var(--red2);background:rgba(192,57,43,0.15);padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;margin-left:8px}

/* PLAYLISTS */
.section-title{font-family:"Bebas Neue",cursive;font-size:20px;letter-spacing:2px;color:var(--gray2);padding:0 20px 12px;text-transform:uppercase}
.playlists-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 20px}
.playlist-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.playlist-card::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--red);transform:scaleX(0);transition:transform 0.2s}
.playlist-card:hover::after{transform:scaleX(1)}
.playlist-card:active{transform:scale(0.97)}
.playlist-card.special{background:linear-gradient(135deg,#1a0000,#2a0808);border-color:rgba(192,57,43,0.3)}
.playlist-emoji{font-size:30px;display:block;margin-bottom:8px}
.playlist-name{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.5px;line-height:1.2}
.playlist-count{font-size:12px;color:var(--gray2);margin-top:4px}

/* FOOTER */
.home-footer{margin-top:auto;padding:24px 20px 36px;border-top:1px solid var(--border)}
.social-links{display:flex;gap:8px;margin-bottom:16px;justify-content:center;flex-wrap:wrap}
.social-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;color:var(--white);text-decoration:none;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}
.social-btn:hover{border-color:var(--red);color:var(--red2)}
.social-btn svg{width:15px;height:15px}
.bio-card{background:linear-gradient(135deg,#1a0000,#2a0808);border:1px solid var(--red-border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;cursor:pointer;transition:transform 0.2s}
.bio-card:hover{transform:scale(1.01)}
.bio-card-title{font-family:"Bebas Neue",cursive;font-size:20px;letter-spacing:2px;color:var(--white);margin-bottom:10px}
.bio-card-text{font-size:14px;color:var(--white);line-height:1.6;opacity:0.95}
.bio-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.bio-link{font-size:13px;font-weight:600;color:var(--white);text-decoration:none;padding:10px 14px;background:var(--bg);border:1px solid rgba(0,0,0,0.4);border-radius:20px;transition:all 0.2s;text-align:center}
.bio-link:hover{background:#000;border-color:var(--white)}
.tip-card-home{background:linear-gradient(135deg,#1a0000,#2a0808);border:1px solid var(--red-border);border-radius:var(--radius);padding:20px 24px;text-align:center;cursor:pointer;transition:transform 0.2s;margin-bottom:16px}
.tip-card-home:hover{transform:scale(1.01)}
.tip-card-title{font-family:"Bebas Neue",cursive;font-size:22px;letter-spacing:2px;margin-bottom:6px;color:var(--white)}
.tip-card-sub{font-size:14px;opacity:0.95;color:var(--white)}

/* SCREEN HEADER */
.screen-header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:none;color:var(--white);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.2s}
.back-btn:hover{background:var(--red)}
.screen-header-info{flex:1}
.screen-header-title{font-family:"Bebas Neue",cursive;font-size:22px;letter-spacing:1px}
.screen-header-sub{font-size:12px;color:var(--gray2)}

/* PLAYLIST */
.playlist-search{padding:12px 20px}
.playlist-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 16px;color:var(--white);font-family:"Barlow",sans-serif;font-size:14px;outline:none}
.playlist-search input:focus{border-color:var(--red)}
.playlist-search input::placeholder{color:var(--gray)}
.songs-list{padding:8px 20px}
.song-item{display:flex;align-items:center;padding:14px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all 0.2s}
.song-item:hover{border-color:var(--red);background:#1a0808}
.song-item:active{transform:scale(0.98)}
.song-num{width:28px;height:28px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gray2);flex-shrink:0;margin-right:12px}
.song-info{flex:1}
.song-title{font-weight:600;font-size:15px}
.song-artist{color:var(--gray2);font-size:13px;margin-top:2px}
.song-arrow{color:var(--gray);font-size:20px}
.suggest-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 40px);margin:10px 20px 30px;padding:14px;background:transparent;border:1px dashed rgba(192,57,43,0.4);border-radius:10px;color:var(--red2);font-family:"Barlow",sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s}
.suggest-btn:hover{background:rgba(192,57,43,0.08);border-color:var(--red)}

/* STEPS */
.step-screen{padding:0 20px 30px}
.step-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.3);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--red2);letter-spacing:1px;text-transform:uppercase;margin:24px 0 16px}
.step-song-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:24px;display:flex;align-items:center;gap:12px}
.step-song-icon{width:44px;height:44px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.step-song-title{font-weight:700;font-size:16px}
.step-song-artist{color:var(--gray2);font-size:13px}
.field{margin-bottom:16px;position:relative}
.field label{display:block;font-size:13px;font-weight:700;color:var(--gray2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--white);font-family:"Barlow",sans-serif;font-size:15px;outline:none;transition:border-color 0.2s;resize:none}
.field input:focus,.field textarea:focus{border-color:var(--red)}
.field input::placeholder,.field textarea::placeholder{color:var(--gray)}
.optional{font-size:11px;color:var(--gray);font-weight:400;text-transform:none;letter-spacing:0;margin-left:4px}

/* AUTOCOMPLETE */
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--red);border-radius:0 0 8px 8px;z-index:200;max-height:160px;overflow-y:auto}
.autocomplete-item{padding:10px 16px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.15s}
.autocomplete-item:hover{background:rgba(192,57,43,0.15);color:var(--red2)}
.autocomplete-item:last-child{border-bottom:none}

/* BUTTONS */
.btn-primary{width:100%;background:var(--red);color:white;border:none;border-radius:10px;padding:16px;font-family:"Bebas Neue",cursive;font-size:20px;letter-spacing:2px;cursor:pointer;transition:all 0.2s;margin-top:8px}
.btn-primary:hover{background:var(--red2);transform:translateY(-1px)}
.btn-primary:active{transform:scale(0.98)}
.btn-secondary{width:100%;background:transparent;color:var(--gray2);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:"Barlow",sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;margin-top:8px}
.btn-secondary:hover{color:var(--white);border-color:var(--gray2)}

/* TIP JAR (Step 2) */
.tip-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tip-opt-btn{background:var(--bg3);border:2px solid var(--border);border-radius:10px;padding:16px;color:var(--white);font-family:"Barlow",sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.tip-opt-btn:hover{border-color:var(--red);color:var(--red2)}
.tip-opt-btn.selected{border-color:var(--red);background:rgba(192,57,43,0.15);color:var(--red2)}
.tip-opt-icon{font-size:24px}
.tip-opt-label{font-size:11px;color:var(--gray2);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.tip-detail-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;margin:12px 0;display:none}
.tip-detail-box.show{display:block}
.tip-key-label{font-size:12px;color:var(--gray2);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px}
.tip-key-value{font-size:15px;font-weight:600;word-break:break-all;margin-bottom:10px}
.copy-btn{background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.3);border-radius:8px;padding:8px 16px;color:var(--red2);font-family:"Barlow",sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s}
.copy-btn:hover{background:rgba(192,57,43,0.25)}
.pix-note-en{font-size:11px;color:var(--gray);margin-top:8px;font-style:italic}

/* PIX QR */
.pix-qr-wrap{text-align:center;margin:16px 0 8px}
.pix-qr-wrap canvas,.pix-qr-wrap img{border-radius:8px;display:inline-block}

/* CONFIRM */
.confirm-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100vh;padding:40px 30px}
.confirm-icon{font-size:72px;margin-bottom:20px;animation:bounce 0.6s ease}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.confirm-title{font-family:"Bebas Neue",cursive;font-size:42px;letter-spacing:3px;margin-bottom:10px}
.confirm-sub{color:var(--gray2);font-size:15px;line-height:1.5;margin-bottom:12px}
.confirm-fb{color:#4267B2;font-weight:700;font-size:16px;margin-bottom:30px}

/* ADMIN LOGIN */
.admin-login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 30px}
.admin-lock{font-size:48px;margin-bottom:20px}
.admin-login-title{font-family:"Bebas Neue",cursive;font-size:32px;letter-spacing:3px;margin-bottom:8px}
.admin-login-sub{color:var(--gray2);font-size:14px;margin-bottom:30px;text-align:center}

/* SHOWS */
.shows-banner{margin:0 0 16px;background:linear-gradient(135deg,#1a0000,#2a0808);border:1px solid var(--red-border);border-radius:var(--radius);padding:20px 24px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:14px}
.shows-banner:hover{transform:scale(1.01)}
.shows-banner-icon{font-size:36px;flex-shrink:0}
.shows-banner-info{flex:1}
.shows-banner-title{font-family:"Bebas Neue",cursive;font-size:22px;letter-spacing:2px;color:var(--white)}
.shows-banner-sub{font-size:14px;color:var(--white);margin-top:2px;opacity:0.95}
.shows-banner-arrow{font-size:26px;color:var(--white);flex-shrink:0}
.shows-grid{padding:12px 20px 24px}
.show-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;margin-bottom:12px;position:relative;overflow:hidden;animation:fadeIn 0.25s ease}
.show-card::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--red)}
.show-header-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.show-date-badge{display:flex;flex-direction:column;align-items:center;background:var(--red);border-radius:8px;padding:7px 10px;min-width:50px;flex-shrink:0;text-align:center}
.show-date-day{font-family:"Bebas Neue",cursive;font-size:26px;line-height:1;color:white}
.show-date-mon{font-size:10px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,0.85);letter-spacing:1px}
.show-title{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:0.5px;line-height:1.25;flex:1}
.show-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.show-meta-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--gray2);background:var(--bg2);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}
.show-teleport-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:linear-gradient(135deg,#c0392b,#7b0000);border:none;border-radius:8px;color:white;font-family:"Bebas Neue",cursive;font-size:16px;letter-spacing:2px;cursor:pointer;text-decoration:none;transition:opacity 0.2s}
.show-teleport-btn:hover{opacity:0.82}
.shows-empty{text-align:center;padding:60px 24px}
.shows-empty-icon{font-size:56px;margin-bottom:16px}
.shows-empty-title{font-family:"Bebas Neue",cursive;font-size:26px;letter-spacing:2px;margin-bottom:8px}
.shows-empty-sub{font-size:14px;color:var(--gray2);line-height:1.6}
.shows-loading{display:flex;flex-direction:column;align-items:center;padding:60px 20px;gap:16px}
.shows-loading-text{font-size:14px;color:var(--gray2)}
.shows-error{margin:20px;background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.3);border-radius:var(--radius);padding:20px;text-align:center;font-size:14px;color:var(--gray2)}

/* ADMIN BULK SELECT */
.admin-bulk-bar{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:2px solid var(--red);padding:10px 16px;z-index:500;animation:slideUp 0.2s ease}
.admin-bulk-cnt{font-size:13px;font-weight:700;margin-bottom:8px}.admin-bulk-cnt em{color:var(--red2);font-style:normal}
.admin-bulk-actions{display:flex;gap:6px;flex-wrap:wrap}
.admin-bulk-btn{flex:1;min-width:70px;padding:8px 6px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--white);font-family:'Barlow',sans-serif;font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.admin-bulk-btn.danger{border-color:rgba(192,57,43,.4);color:var(--red2)}
.admin-bulk-move-pls{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.admin-bulk-info{font-size:13px;font-weight:700;color:var(--white);margin-bottom:8px}<br>.admin-bulk-info span{color:var(--red2)}
.admin-bulk-pls{display:flex;flex-wrap:wrap;gap:6px}
.admin-bulk-pl-btn{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:6px 14px;color:var(--white);font-size:12px;font-weight:700;cursor:pointer;font-family:"Barlow",sans-serif;transition:all 0.2s}
.admin-bulk-pl-btn:hover{border-color:var(--red);color:var(--red2);background:rgba(192,57,43,0.1)}
.admin-song-item.bulk-selected{border-color:var(--red);background:rgba(192,57,43,0.12)}
.admin-song-cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--gray);flex-shrink:0;margin-right:8px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all 0.15s;cursor:pointer}
.bulk-selected .admin-song-cb{background:var(--red);border-color:var(--red);color:white}

/* ADMIN */
.admin-screen{display:flex;flex-direction:column;min-height:100vh;padding-bottom:80px}
.admin-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px}
.admin-logo{font-family:"Bebas Neue",cursive;font-size:20px;letter-spacing:2px;color:var(--red2)}
.admin-title{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:700;color:var(--gray2);text-transform:uppercase;letter-spacing:1px;flex:1}
.logout-btn{background:none;border:1px solid var(--border);color:var(--gray2);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:"Barlow",sans-serif}
.admin-content{flex:1;padding:16px 20px;overflow-y:auto}
.admin-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:1000}
.admin-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;background:none;border:none;color:var(--gray);font-family:"Barlow",sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:color 0.2s;text-transform:uppercase;letter-spacing:0.5px}
.admin-nav-btn .nav-icon{font-size:20px}
.admin-nav-btn.active{color:var(--red2)}

/* REQUEST CARD */
.request-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.request-card.has-tip{border-color:rgba(192,57,43,0.4);background:linear-gradient(135deg,rgba(26,0,0,0.6),rgba(30,30,30,0.8))}
.req-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.req-name{font-weight:700;font-size:14px;flex:1}
.tip-badge{background:rgba(192,57,43,0.2);border:1px solid rgba(192,57,43,0.4);border-radius:12px;padding:2px 8px;font-size:11px;font-weight:700;color:var(--red2)}
.req-time{font-size:11px;color:var(--gray)}
.req-song{font-size:15px;font-weight:600;margin-bottom:4px}
.req-msg{font-size:13px;color:var(--gray2);font-style:italic;margin:6px 0;padding-left:8px;border-left:2px solid var(--border)}
.req-reactions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.reaction-btn{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--gray2);font-family:"Barlow",sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s}
.reaction-btn:hover{border-color:var(--red);color:var(--red2)}
.reaction-btn.sent{border-color:var(--red);background:rgba(192,57,43,0.15);color:var(--red2)}
.req-actions{display:flex;gap:8px;margin-top:10px}
.req-btn{flex:1;padding:8px;border:none;border-radius:8px;font-family:"Barlow",sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s}
.req-played{background:rgba(46,204,113,0.15);color:#2ecc71;border:1px solid rgba(46,204,113,0.3)}
.req-dismiss{background:var(--bg2);color:var(--gray2);border:1px solid var(--border)}

/* ADMIN FORMS */
.add-form{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.add-form h4{font-family:"Bebas Neue",cursive;font-size:16px;letter-spacing:1px;color:var(--gray2);margin-bottom:12px}
.btn-add{background:var(--red);color:white;border:none;border-radius:8px;padding:10px 20px;font-family:"Barlow",sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s}
.btn-add:hover{background:var(--red2)}
.admin-pl-item{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.admin-pl-name{font-weight:700;font-size:14px}
.admin-pl-count{font-size:12px;color:var(--gray2)}
.manage-btn{background:none;border:1px solid var(--border);color:var(--gray2);padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:"Barlow",sans-serif;transition:all 0.2s}
.manage-btn:hover{border-color:var(--red2);color:var(--red2)}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:background 0.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--gray);transition:all 0.2s}
.toggle.on{background:rgba(192,57,43,0.3);border-color:var(--red)}
.toggle.on::after{left:21px;background:var(--red2)}
.pl-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pl-pill{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;color:var(--gray2);font-size:13px;font-weight:600;cursor:pointer;font-family:"Barlow",sans-serif;transition:all 0.2s}
.pl-pill.active{border-color:var(--red);color:var(--red2);background:rgba(192,57,43,0.1)}
.admin-song-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.admin-song-item.hidden-song{opacity:0.4}
.admin-song-info{flex:1}
.admin-song-title{font-weight:700;font-size:14px}
.admin-song-artist{font-size:12px;color:var(--gray2)}
.artist-row{display:flex;gap:8px;align-items:flex-end}
.artist-row .field{flex:1}
.btn-plus{background:none;border:1px solid var(--border);color:var(--gray2);width:36px;height:44px;border-radius:8px;font-size:20px;cursor:pointer;flex-shrink:0;transition:all 0.2s;margin-bottom:0}
.btn-plus:hover{border-color:var(--red);color:var(--red2)}
.bulk-section{background:var(--bg3);border:1px dashed rgba(192,57,43,0.3);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.bulk-section h4{font-family:"Bebas Neue",cursive;font-size:15px;letter-spacing:1px;color:var(--gray2);margin-bottom:8px}
.bulk-section p{font-size:12px;color:var(--gray2);line-height:1.6;margin-bottom:8px}
.bulk-section textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--white);font-family:"Barlow",sans-serif;font-size:13px;outline:none;min-height:100px;resize:vertical}
.bulk-section textarea:focus{border-color:var(--red)}
.wish-item{display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.wish-count{width:28px;height:28px;border-radius:50%;background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--red2);flex-shrink:0}
.cfg-section{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.cfg-section h4{font-family:"Bebas Neue",cursive;font-size:15px;letter-spacing:1px;color:var(--gray2);margin-bottom:12px}
.cfg-field{margin-bottom:12px}
.cfg-field label{display:block;font-size:12px;font-weight:700;color:var(--gray2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.cfg-field input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--white);font-family:"Barlow",sans-serif;font-size:14px;outline:none}
.cfg-field input:focus{border-color:var(--red)}
.save-cfg-btn{width:100%;background:var(--red);color:white;border:none;border-radius:10px;padding:14px;font-family:"Bebas Neue",cursive;font-size:18px;letter-spacing:2px;cursor:pointer;margin-top:8px}
.qr-section{text-align:center}
.safe-row{display:flex;align-items:center;gap:12px}
.safe-info{flex:1}
.safe-title{font-weight:700;font-size:14px}
.safe-sub{font-size:12px;color:var(--gray2);margin-top:2px}
.empty-state{text-align:center;padding:40px 20px}
.empty-icon{font-size:48px;margin-bottom:12px}
.loading{display:flex;justify-content:center;padding:40px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* REACTION POPUP */
.reaction-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500}
.admin-reaction-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg2);border:2px solid var(--red);border-radius:20px;padding:32px 24px;z-index:501;max-width:300px;width:90%;text-align:center;animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1)}@keyframes popIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.admin-reaction-emoji{font-size:64px;margin-bottom:12px}
.admin-reaction-from{font-size:12px;color:var(--gray2);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.admin-reaction-text{font-family:"Bebas Neue",cursive;font-size:28px;letter-spacing:2px;margin-top:6px;color:var(--red2)}
</style>
</head>

  const prev=backMap[S.screen]||"home";
  if(prev==="home"){S.screen="home";S.searchQuery="";S.searchResults=[];S.currentPlaylist=null;S.currentSong=null;}else{S.screen=prev;}
  render();window.scrollTo(0,0);
});

// ══ SEARCH ══
let _searchTimer=null;
function doSearch(q){
  S.searchQuery=q;
  const lq=q.toLowerCase();
  if(!q.trim()){
    S.searchResults=[];
  }else{
    S.searchResults=S.allSongs.filter(s=>s.visible!==false&&(s.title?.toLowerCase().includes(lq)||s.artist?.toLowerCase().includes(lq)));
  }
  updateSearchDisplay();
}
function updateSearchDisplay(){
  const sr=document.querySelector(".search-results");
  const hc=document.querySelector(".home-content");
  if(!sr)return;
  const hasQ=S.searchQuery.trim().length>0;
  sr.style.display=hasQ?"":"none";
  if(hc)hc.style.display=hasQ?"none":"";
  sr.innerHTML=hasQ?renderSearchResults():"";
  sr.querySelectorAll(".search-result-item").forEach(el=>{
    el.onclick=()=>selectSong(el.dataset.plid,el.dataset.sid);
  });
}
function getArtists(){return[...new Set(S.allSongs.map(s=>s.artist).filter(Boolean))].sort();}
function getSongs(){return[...new Set(S.allSongs.map(s=>s.title).filter(Boolean))].sort();}
function getKnownNames(){try{return JSON.parse(localStorage.getItem("knownNames")||"[]");}catch{return[];}}
function saveKnownName(name){try{const n=getKnownNames();if(name&&!n.includes(name)){n.unshift(name);localStorage.setItem("knownNames",JSON.stringify(n.slice(0,20)));}}catch{}}
function showAutocomplete(inputId,items,onSelect){
  const inp=document.getElementById(inputId);if(!inp)return;
  const val=inp.value.toLowerCase();
  document.querySelectorAll(".autocomplete-list").forEach(e=>e.remove());
  if(!val)return;
  const matches=items.filter(i=>i.toLowerCase().includes(val)).slice(0,5);
  if(!matches.length)return;
  const list=document.createElement("div");list.className="autocomplete-list";
  matches.forEach(m=>{const d=document.createElement("div");d.className="autocomplete-item";d.textContent=m;d.onclick=()=>{inp.value=m;onSelect&&onSelect(m);document.querySelectorAll(".autocomplete-list").forEach(e=>e.remove());};list.appendChild(d);});
  inp.parentNode.appendChild(list);
}

// ══ RENDER ══
function render(){
  const root=document.getElementById("root");
  switch(S.screen){
    case"home":root.innerHTML=renderHome();break;
    case"playlist":root.innerHTML=renderPlaylist();break;
    case"step1":root.innerHTML=renderStep1();break;
    case"step2":root.innerHTML=renderStep2();break;
    case"confirm":root.innerHTML=renderConfirm();break;
    case"suggest":root.innerHTML=renderSuggest();break;
    case"shows":root.innerHTML=renderShows();break;
    case"admin-login":root.innerHTML=renderAdminLogin();break;
    default:if(S.isAdmin)renderAdmin();else root.innerHTML=renderHome();
  }
  attachEvents();
}

function renderSearchResults(){
  const q=S.searchQuery.trim();
  if(S.searchResults.length===0){
    return`<div class="empty-state">
      <div class="empty-icon">🎵</div>
      <p>No song found${q?` for "${esc(q)}"`:""}.</p>
      <button class="suggest-btn" style="width:calc(100% - 40px);margin:16px 20px" onclick="goTo('suggest',{currentPlaylist:null,suggestTitle:'${q.replace(/'/g,"\\'")}',suggestArtist:''})">➕ Add to wishlist</button>
    </div>`;
  }
  const grouped={};
  S.searchResults.forEach(s=>{
    const key=s.artist||"?";
    if(!grouped[key])grouped[key]={artist:s.artist,songs:[]};
    grouped[key].songs.push(s);
  });
  return Object.values(grouped).map(g=>`
    <div style="margin-bottom:20px">
      <div style="padding:0 20px 8px;font-size:12px;color:var(--gray2);font-weight:700;text-transform:uppercase;letter-spacing:1px">${esc(g.artist)}</div>
      ${g.songs.map(s=>`<div class="search-result-item" data-plid="${s.playlistId}" data-sid="${s.id}" style="margin:0 20px 6px"><div class="search-result-info"><div class="search-result-title">${esc(s.title)}</div></div></div>`).join("")}
    </div>
  `).join("");
}

function renderPlaylist(){
  const pl=S.currentPlaylist;if(!pl)return"";
  const songs=(S.songs[pl.id]||[]).filter(s=>s.visible!==false);
  const q=S._plSearch||"";
  const selMode=S.selectionMode;
  const selIds=new Set(S.selectedSongs.map(x=>x.id));
  
  function songRow(s,i){
    const sel=selIds.has(s.id);
    if(selMode){return`<div class="song-item ${sel?"song-selected":""}" onclick="toggleSongSel('${s.playlistId}','${s.id}')"><div class="song-check">${sel?"✓":""}</div><div class="song-info"><div class="song-title">${s.artist}</div><div class="song-artist">${s.title}</div></div></div>`;}
    return`<div class="song-item" onclick="selectSong('${s.playlistId}','${s.id}')"><div class="song-num">${i+1}</div><div class="song-info"><div class="song-title">${s.artist}</div><div class="song-artist">${s.title}</div></div><span class="song-arrow">›</span></div>`;
  }
  
  let songsHtml="";
  
  if(pl.id==="__all__"){
    const grouped={};
    songs.forEach(s=>{if(!grouped[s.artist])grouped[s.artist]=[];grouped[s.artist].push(s);});
    const sorted=Object.keys(grouped).sort();
    let counter=0;
    sorted.forEach(artist=>{
      const artistSongs=grouped[artist];
      songsHtml+=`<div class="artist-group">`;
      artistSongs.forEach(s=>{counter++;songsHtml+=songRow(s,counter);});
      songsHtml+=`</div>`;
    });
    return`<div class="screen fade-in"><div class="screen-header"><button class="back-btn" onclick="goHome()">←</button><div class="screen-header-info"><div class="screen-header-title">${pl.emoji||"🎵"} ${pl.name}</div><div class="screen-header-sub">${songs.length} songs in the setlist</div></div><button class="select-toggle ${selMode?"active":""}" onclick="toggleSelMode()">${selMode?"Cancel":"Select"}</button></div><div class="playlist-search"><input type="text" id="pl-search" placeholder="Filter songs..." oninput="filterPl(this.value)" autocomplete="off" value="${q}"></div><div class="songs-list" style="${selMode?"padding-bottom:80px":""}">      ${songsHtml}</div>${!selMode?`<button class="suggest-btn" onclick="goTo('suggest',{currentPlaylist:S.currentPlaylist})">➕ Don't see your song? Suggest one</button>`:""}${selMode&&S.selectedSongs.length>0?`<div class="select-bar"><div class="select-bar-info"><span>${S.selectedSongs.length}</span> song${S.selectedSongs.length>1?"s":""} selected</div><button class="btn-request-all" onclick="requestSelectedSongs()">🎸 REQUEST ALL</button></div>`:""}</div>`;
  }
  songs.forEach((s,i)=>{songsHtml+=songRow(s,i+1);});
  return`<div class="screen fade-in"><div class="screen-header"><button class="back-btn" onclick="goHome()">←</button><div class="screen-header-info"><div class="screen-header-title">${pl.emoji||"🎵"} ${pl.name}</div><div class="screen-header-sub">${songs.length} songs in the setlist</div></div><button class="select-toggle ${selMode?"active":""}" onclick="toggleSelMode()">${selMode?"Cancel":"Select"}</button></div><div class="playlist-search"><input type="text" id="pl-search" placeholder="Filter songs..." oninput="filterPl(this.value)" autocomplete="off" value="${q}"></div><div class="songs-list" style="${selMode?"padding-bottom:80px":""}">      ${songsHtml}</div>${!selMode?`<button class="suggest-btn" onclick="goTo('suggest',{currentPlaylist:S.currentPlaylist})">➕ Don't see your song? Suggest one</button>`:""}${selMode&&S.selectedSongs.length>0?`<div class="select-bar"><div class="select-bar-info"><span>${S.selectedSongs.length}</span> song${S.selectedSongs.length>1?"s":""} selected</div><button class="btn-request-all" onclick="requestSelectedSongs()">🎸 REQUEST ALL</button></div>`:""}</div>`;
}

function filterPl(q){
  S._plSearch=q.toLowerCase();
  const sl=document.querySelector(".songs-list");if(!sl)return;
  const pl=S.currentPlaylist;
  const songs=(S.songs[pl.id]||[]).filter(s=>s.visible!==false);
  const filtered=q?songs.filter(s=>s.title?.toLowerCase().includes(q)||s.artist?.toLowerCase().includes(q)):songs;
  const selMode=S.selectionMode;const selIds=new Set(S.selectedSongs.map(x=>x.id));
  sl.innerHTML=(filtered.length===0?'<div class="empty-state"><p>No songs found.</p></div>':"")+filtered.map((s,i)=>{
    const sel=selIds.has(s.id);
    if(selMode)return`<div class="song-item ${sel?"song-selected":""}" onclick="toggleSongSel('${s.playlistId}','${s.id}')"><div class="song-check">${sel?"✓":""}</div><div class="song-info"><div class="song-title">${s.artist}</div><div class="song-artist">${s.title}</div></div></div>`;

async function confirmRequest(hasTip){
  const songs=S.selectedSongs.length>1?S.selectedSongs:[S.currentSong];
  try{
    const ids=[];
    for(const song of songs){
      if(!song||!song.title)continue;
      const ref=await db.collection("requests").add({songTitle:song.title,songArtist:song.artist,playlistId:song.playlistId||"",requesterName:S.requesterName.trim()||"Anonymous",message:S.message.trim(),hasTip,tipMethod:hasTip?(S.tipMethod||""):"",status:"pending",adminReaction:null,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      ids.push(ref.id);
    }
    S.lastReqIds=ids;S.adminReaction=null;
    goTo("confirm");startReactionListener();
  }catch(e){toast("Error sending request. Try again.");}
}

async function submitSuggest(){
  const title=document.getElementById("sg-title")?.value.trim();
  const artist=document.getElementById("sg-artist")?.value.trim();
  const name=document.getElementById("sg-name")?.value.trim();
  if(!title||!artist){toast("Please fill in song and artist!");return;}
  try{
    const ex=S.wishlist.find(w=>w.title.toLowerCase()===title.toLowerCase()&&w.artist.toLowerCase()===artist.toLowerCase());
    if(ex)await db.collection("wishlist").doc(ex.id).update({count:firebase.firestore.FieldValue.increment(1),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    else await db.collection("wishlist").add({title,artist,count:1,requestedBy:name||"Anonymous",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    S.suggestTitle="";S.suggestArtist="";
    toast("Suggestion sent! 🎸");setTimeout(()=>goHome(),1200);
  }catch(e){toast("Error sending. Try again.");}
}

async function bulkMoveSongs(toPlId){

  const toPl=S.playlists.find(p=>p.id===toPlId);
  toast(`Moving ${songs.length} songs...`);
  let ok=0;
  for(const song of songs){

    try{
      await db.collection("playlists").doc(toPlId).collection("songs").doc(song.id).set({title:song.title,artist:song.artist,visible:song.visible!==false,addedAt:firebase.firestore.FieldValue.serverTimestamp()});

async function importBulk(){
  const text = document.getElementById("bulk-input")?.value.trim();
  if(!text){
    toast("Paste songs in the field above!");
    return;
  }
  if(!S.adminSongsPl){
    toast("Select a playlist!");
    return;
  }
  const lines = text.includes("|") 
    ? text.split("|").map(l=>l.trim()).filter(l=>l)
    : text.split("\n").map(l=>l.trim()).filter(l=>l);
  const validLines = lines.filter(l => l.includes(" - "));
  if(!validLines.length){
    toast("Wrong format! Use: Song - Artist");
    return;
  }
  toast("Importing "+validLines.length+" songs...");
  let ok=0;
  for(const line of validLines){
    const sep = line.indexOf(" - ");
    if(sep===-1) continue;
    const title = line.substring(0, sep).trim();
    const artist = line.substring(sep+3).trim();
    if(!title || !artist) continue;
    try{
      const ref = await db.collection("playlists").doc(S.adminSongsPl).collection("songs").add({title,artist,visible:true,addedAt:firebase.firestore.FieldValue.serverTimestamp()});
      const ns = {id:ref.id,title,artist,visible:true,playlistId:S.adminSongsPl,playlistName:S.playlists.find(p=>p.id===S.adminSongsPl)?.name};
      if(!S.songs[S.adminSongsPl])S.songs[S.adminSongsPl]=[];
      S.songs[S.adminSongsPl].push(ns);
      S.allSongs.push(ns);
      ok++;
    }catch(e){}
  }
  toast(ok+" songs imported! 🎤");
  setTimeout(()=>renderAdmin(),500);
}

function getVenueLogo(location,description,summary){
  const text=((location||"")+" "+(description||"")+" "+(summary||"")).toLowerCase();
  const BASE="https://sl.sujeitorock.com.br/logos/";
  if(text.includes("audiohouse"))return BASE+"audiohouse.png";
  if(text.includes("twisted"))return BASE+"TwistedOrchid-Logo.jpg";
  if(text.includes("piazza"))return BASE+"la-piazza.jpg";
  if(text.includes("nevermore"))return BASE+"nevermore.png";
  if(text.includes("no name")||text.includes("no-name"))return BASE+"no-name.jpg";
  if(text.includes("opposite"))return BASE+"opposite.jpg";
  if(text.includes("portugal"))return BASE+"portugal-music.jpg";
  return null;
}

function extractSLLink(text){
  if(!text)return null;
  const m=text.match(/secondlife:\/\/[^\s"<\]]+/i);
  return m?m[0]:null;
}

function formatShowDate(event){
  const start=event.start?.dateTime||event.start?.date;
  if(!start)return{day:"?",mon:"?",time:null,weekday:"",year:""};
  const d=new Date(start);
  const allDay=!event.start?.dateTime;
  const TZ="America/Los_Angeles";
  const day=parseInt(d.toLocaleString("en-US",{day:"numeric",timeZone:TZ}),10);
  const mon=d.toLocaleString("en-US",{month:"short",timeZone:TZ}).toUpperCase();
  const weekday=d.toLocaleString("en-US",{weekday:"long",timeZone:TZ});
  const year=parseInt(d.toLocaleString("en-US",{year:"numeric",timeZone:TZ}),10);
  const time=allDay?null:d.toLocaleString("en-US",{hour:"2-digit",minute:"2-digit",hour12:true,timeZone:TZ});
  const localTime=allDay?null:d.toLocaleString(undefined,{hour:"2-digit",minute:"2-digit",hour12:true});
  return{day,mon,time,localTime,weekday,year};
}

          </div>
          <div class="show-meta">
            ${time?`<span class="show-meta-pill">🕐 ${time} SLT${localTime&&localTime!==time?` <span style="opacity:0.7;font-size:11px">• ${localTime} your time</span>`:""}</span>`:""}
            <span class="show-meta-pill">📍 ${esc(venue)}</span>
            ${weekday?`<span class="show-meta-pill">📆 ${weekday}</span>`:""}
          </div>
          ${shortDesc?`<div style="font-size:12px;color:var(--gray2);margin-bottom:12px;line-height:1.5">${esc(shortDesc)}</div>`:""}
          <a href="${slLink}" class="show-teleport-btn">🌀 TELEPORT TO SHOW</a>
        </div>`;
      }).join("")}
    </div>`}
  </div>`;
}

// ══ LISTENERS ══
function listenReqs(){
  if(S.reqListener)S.reqListener();
  S.reqListener=db.collection("requests").where("status","==","pending").onSnapshot(snap=>{
    const newCount=snap.size;
    if(S._prevReqCount>=0&&newCount>S._prevReqCount)playNotifSound();
    S._prevReqCount=newCount;
    S.requests=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
      const ta=a.createdAt?.toMillis?.()||0;
      const tb=b.createdAt?.toMillis?.()||0;
      return ta-tb;
    });
    if(S.isAdmin&&S.adminTab==="requests")renderAdmin();
  },err=>{
    console.error("listenReqs error:",err);
    toast("⚠️ Listener error: "+err.message,4000);
  });
}
function listenWish(){if(S.wishListener)S.wishListener();S.wishListener=db.collection("wishlist").orderBy("count","desc").onSnapshot(snap=>{S.wishlist=snap.docs.map(d=>({id:d.id,...d.data()}));if(S.isAdmin&&S.adminTab==="wishlist")renderAdmin();});}

function startReactionListener(){
  if(S._reactionListener){S._reactionListener();S._reactionListener=null;}
  if(!S.lastReqIds||!S.lastReqIds.length)return;
  S._reactionListener=db.collection("requests").doc(S.lastReqIds[0]).onSnapshot(snap=>{
    const data=snap.data();
    if(data&&data.adminReaction&&data.adminReaction!==S.adminReaction){S.adminReaction=data.adminReaction;if(S.screen==="confirm")showClientReaction(data.adminReaction);}
  });
}
function showClientReaction(reaction){
  document.querySelectorAll(".admin-reaction-popup,.reaction-overlay").forEach(e=>e.remove());
  const isEmoji=/^\p{Emoji}/u.test(reaction);
  const overlay=document.createElement("div");overlay.className="reaction-overlay";overlay.onclick=()=>{overlay.remove();document.querySelector(".admin-reaction-popup")?.remove();};
  const popup=document.createElement("div");popup.className="admin-reaction-popup";
  popup.innerHTML=`<div class="admin-reaction-emoji">${isEmoji?reaction:"🤘"}</div><div class="admin-reaction-from">Artist's response</div><div class="admin-reaction-text">${isEmoji?"ROCK ON!":reaction}</div><button class="btn-secondary" style="margin-top:16px;width:100%" onclick="this.closest('.admin-reaction-popup').remove();document.querySelector('.reaction-overlay')?.remove()">🤘 Thanks!</button>`;
  document.body.appendChild(overlay);document.body.appendChild(popup);
  playNotifSound();setTimeout(()=>{popup.remove();overlay.remove();},8000);
}
function playNotifSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(440,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.1);g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.4);o.start();o.stop(ctx.currentTime+0.4);}catch(e){}}
function requestNotifPerm(){if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();}
function activateAdminKeepAlive(){setInterval(()=>{if(S.isAdmin){try{db.collection("_keep").doc("alive").set({t:Date.now()}).catch(()=>{});}catch(e){}}},25000);}

// ══ EVENTS ══
function attachEvents(){
  const lp=document.getElementById("login-pass");
  if(lp)lp.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
  document.addEventListener("click",e=>{if(!e.target.closest(".field"))document.querySelectorAll(".autocomplete-list").forEach(el=>el.remove());},{once:true});
}

// ══ FIREBASE LOAD ══
async function loadConfig(){try{const doc=await db.collection("config").doc("main").get();if(doc.exists)S.config={...S.config,...doc.data()};}catch(e){}}
async function loadPlaylists(){
  try{
    const snap=await db.collection("playlists").orderBy("order","asc").get();
    S.playlists=snap.docs.map(d=>({id:d.id,...d.data()}));
    await Promise.all(S.playlists.map(async pl=>{
     const ss=await db.collection("playlists").doc(pl.id).collection("songs").get();
      S.songs[pl.id]=ss.docs.map(d=>({id:d.id,...d.data(),playlistId:pl.id,playlistName:pl.name}));
      S.allSongs.push(...S.songs[pl.id]);
    }));
    playlistsLoaded=true;render();
  }catch(e){playlistsLoaded=true;render();}
}

// ══ BOOT ══
auth.onAuthStateChanged(user=>{
  if(user){
    const eraAdmin=localStorage.getItem("sr_was_admin")==="1";
    const vaiParaAdmin=S.screen==="admin-login"||window.location.hash==="#admin";
    if(eraAdmin||vaiParaAdmin){localStorage.setItem("sr_was_admin","1");S.isAdmin=true;S.adminTab="requests";S._prevReqCount=-1;listenReqs();listenWish();requestNotifPerm();activateAdminKeepAlive();renderAdmin();}
  }
});
async function init(){history.replaceState({screen:"home"},"home","");await loadConfig();render();loadPlaylists();if(window.location.hash==="#admin")goTo("admin-login");}
init();
</script>
